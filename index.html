<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Second Nature Hiring</title>
<style>
  :root {
    --bg: #ffffff; --bg-sunken: #f7f8fa; --bg-active: #eceef2;
    --border: #e7e9ee; --text: #16181d; --text-2: #3d4149; --text-3: #646b79; --text-4: #8a90a0;
    --accent: #2857d6; --accent-soft: rgba(40,87,214,.08); --accent-border: rgba(40,87,214,.32);
    --green: #157a4e; --green-bg: #e9f6ef; --green-border: #b5decb;
    --amber: #91580b; --amber-bg: #faf0dd; --amber-border: #ebcf98;
    --red: #b3261e; --red-bg: #fbebea; --red-border: #f0bcb8;
    --r: 10px; --shadow: 0 1px 2px rgba(22,24,29,.04); --shadow-lg: 0 12px 32px rgba(22,24,29,.12);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: light; }
  body { font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--text); background: var(--bg-sunken); -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; font-family: var(--mono); }

  /* topbar */
  .topbar { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(140deg, var(--accent), #4d78e6);
          color: #fff; font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
  .brand { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .fresh { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-4); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

  .wrap { max-width: 760px; margin: 0 auto; padding: 18px 16px 80px; }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r);
          box-shadow: var(--shadow); padding: 20px; margin-bottom: 14px; }

  /* login */
  .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gate .card { width: 100%; max-width: 380px; padding: 32px 28px; box-shadow: var(--shadow-lg); text-align: center; }
  .gate h1 { font-size: 19px; margin: 14px 0 4px; }
  .gate p { color: var(--text-3); font-size: 13.5px; margin-bottom: 20px; }
  .gate input { width: 100%; font: inherit; font-size: 16px; text-align: center; letter-spacing: .06em;
                padding: 11px; border: 1px solid #d4d7de; border-radius: 8px; outline: none; }
  .gate input:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn { display: inline-block; width: 100%; margin-top: 12px; padding: 11px; font: inherit; font-size: 15px; font-weight: 650;
         color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  .btn:disabled { opacity: .55; }
  .gate .err { display: none; margin-top: 12px; font-size: 13px; color: var(--red); }
  .gate .foot { margin-top: 18px; font-size: 11.5px; color: var(--text-4); }

  /* nir pipeline tiles */
  .tiles { display: flex; gap: 10px; margin-bottom: 16px; }
  .tile { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r);
          box-shadow: var(--shadow); padding: 14px 12px; text-align: center; }
  .tile.lead { border-color: var(--accent-border); background: var(--accent-soft); }
  .tile .tn { font-size: 30px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .tile.lead .tn { color: var(--accent); }
  .tile.rej .tn { color: var(--red); }
  .tile .tl { font-size: 11.5px; font-weight: 650; color: var(--text-3); margin-top: 5px; text-transform: uppercase; letter-spacing: .04em; }
  .tile .ts { font-size: 10.5px; color: var(--text-4); margin-top: 2px; }
  .crow-static { cursor: default; }
  .role-sub { font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-4); padding: 12px 0 2px; border-bottom: 1px solid var(--border); }
  .role-count { font-weight: 600; color: var(--text-3); margin-left: 4px; }
  .action-card { border-left: 3px solid var(--accent); }
  .dim-card { opacity: .82; }
  .sec-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-4); margin: 20px 0 6px; }
  .muted-line { font-size: 12.5px; color: var(--text-4); margin: 10px 2px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 26px 0 16px; }
  .explore-h { font-size: 15px; font-weight: 700; margin-bottom: 4px; }

  /* banner */
  .banner { background: var(--bg); border: 1px solid var(--accent-border); border-left: 4px solid var(--accent);
            border-radius: var(--r); padding: 14px 18px; margin-bottom: 16px; font-size: 15px; font-weight: 650; }
  .banner.quiet { border-color: var(--border); border-left-color: var(--border); font-weight: 500; color: var(--text-3); }

  /* position card */
  .pos h2 { font-size: 16px; letter-spacing: -.01em; }
  .pos-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .ready-pill { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--accent);
                background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .funnel { margin: 4px 0 14px; }
  .frow { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
  .flabel { width: 92px; font-size: 11.5px; color: var(--text-3); flex-shrink: 0; }
  .ftrack { flex: 1; height: 8px; background: var(--bg-active); border-radius: 4px; overflow: hidden; }
  .ffill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .5s cubic-bezier(.25,.6,.3,1); }
  .fnum { width: 34px; text-align: right; font-size: 12px; color: var(--text-2); }

  .crow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border); cursor: pointer; }
  .crow > div:first-child { flex: 1; min-width: 0; }
  .crow .ctag { flex-shrink: 0; }
  .crow .chev-slot { width: 10px; flex-shrink: 0; text-align: right; }
  .crow:active { background: var(--bg-sunken); }
  .ring { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
          font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .cname { font-weight: 650; font-size: 14.5px; }
  .cstage { font-size: 12px; color: var(--text-3); }
  .chev { color: var(--text-4); }
  :root { --stage-1:#57606f; --stage-1-bg:#f2f4f7; --stage-1-border:#d4d7de;
    --stage-2:#0e7490; --stage-2-bg:#ecf6f9; --stage-2-border:#b3dbe6;
    --stage-3:#0c6478; --stage-3-bg:#ddeef4; --stage-3-border:#8fc8da;
    --stage-4:#2857d6; --stage-4-bg:#ecf0fb; --stage-4-border:#c6d2f2;
    --stage-5:#1f47b6; --stage-5-bg:#e0e7f9; --stage-5-border:#a9bdec;
    --stage-6:#5b34b8; --stage-6-bg:#f0ebfb; --stage-6-border:#cfc2ef;
    --stage-7:#0f766e; --stage-7-bg:#e6f5f3; --stage-7-border:#b7e0da; }
  .wl-logo-gate svg { height: 30px; width: auto; display: block; }
  .wl-logo-top svg { height: 20px; width: auto; display: block; }
  .wl-logo-gate:empty::before { content: "Second Nature"; font-weight: 800; }
  .stagetag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 3px 10px;
    border-radius: 14px; background: var(--bg-sunken); color: var(--text-3);
    border: 1px solid var(--border); white-space: nowrap; }
  .stagetag.st-sourced             { color: var(--stage-1); background: var(--stage-1-bg); border-color: var(--stage-1-border); }
  .stagetag.st-waiting_shmulik     { color: var(--stage-2); background: var(--stage-2-bg); border-color: var(--stage-2-border); border-style: dashed; }
  .stagetag.st-interviewed_shmulik { color: var(--stage-3); background: var(--stage-3-bg); border-color: var(--stage-3-border); }
  .stagetag.st-waiting_hm          { color: var(--stage-4); background: var(--stage-4-bg); border-color: var(--stage-4-border); border-style: dashed; }
  .stagetag.st-interviewed_hm      { color: var(--stage-5); background: var(--stage-5-bg); border-color: var(--stage-5-border); }
  .stagetag.st-waiting_vp          { color: var(--stage-6); background: var(--stage-6-bg); border-color: var(--stage-6-border); border-style: dashed; }
  .stagetag.st-reference_checks    { color: var(--stage-7); background: var(--stage-7-bg); border-color: var(--stage-7-border); border-style: dashed; }
  .stagetag.st-Hired  { color: var(--green); background: var(--green-bg); border-color: var(--green-border); }
  .stagetag.st-Passed { color: var(--red);   background: var(--red-bg);   border-color: var(--red-border); }
  .stagetag.st-Parked { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-border); }
  .stagetag.big { font-size: 13px; padding: 5px 14px; margin-top: 6px; }
  .lilink { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 650; }
  .lilink:hover { text-decoration: underline; }
  .vpill { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
           padding: 2px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .v-green { color: var(--green); background: var(--green-bg); border-color: var(--green-border); }
  .v-amber { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-border); }
  .v-red { color: var(--red); background: var(--red-bg); border-color: var(--red-border); }
  .dim-row { opacity: .55; }

  /* detail */
  .back { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-3);
          text-decoration: none; margin-bottom: 12px; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
  .dhead { display: flex; gap: 16px; align-items: center; }
  .ring.lg { width: 62px; height: 62px; font-size: 19px; border-width: 4px; }
  .dhead h1 { font-size: 20px; letter-spacing: -.015em; }
  .dhead .sub { font-size: 13px; color: var(--text-3); margin-top: 2px; }
  h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-4); margin: 0 0 10px; }
  .headline { font-size: 15px; line-height: 1.6; }
  .fact { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
  .fact .tag { flex-shrink: 0; font-size: 10.5px; font-weight: 700; text-transform: uppercase; padding: 2px 7px;
               border-radius: 4px; height: fit-content; margin-top: 2px; }
  .t-yes { color: var(--green); background: var(--green-bg); }
  .t-no { color: var(--red); background: var(--red-bg); }
  .t-partial { color: var(--amber); background: var(--amber-bg); }
  .t-neutral { color: var(--text-3); background: var(--bg-active); }
  .evidence { color: var(--text-3); font-size: 12.5px; margin-top: 2px; }
  .stars { color: var(--amber); letter-spacing: 2px; font-size: 14px; }
  .screl { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
  .rail { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 6px; }
  .rrow { display: flex; align-items: center; gap: 10px; padding: 7px 2px; }
  .rdot { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 2px solid var(--border); background: var(--bg); position: relative; }
  .rrow.r-done .rdot { background: var(--green); border-color: var(--green); }
  .rrow.r-current .rdot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(40,87,214,.18); }
  .rlabel { font-size: 13px; color: var(--text-4); }
  .rrow.r-done .rlabel { color: var(--text-2); }
  .rrow.r-current .rlabel { color: var(--text); font-weight: 700; }
  .rdate { margin-left: auto; font-size: 11px; color: var(--text-4); font-variant-numeric: tabular-nums; }
  .rail-outcome { margin-top: 6px; font-size: 12.5px; font-weight: 700; }
  .rail-outcome.o-red { color: var(--red); } .rail-outcome.o-green { color: var(--green); }
  .gdots { display: inline-flex; gap: 4px; margin-left: 8px; }
  .gdot { width: 8px; height: 8px; border-radius: 50%; background: var(--bg-active); }
  .gdot.g-pass { background: var(--green); } .gdot.g-reject { background: var(--red); } .gdot.g-pending { background: var(--amber); }
  details { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }
  summary { cursor: pointer; font-size: 13px; font-weight: 650; color: var(--text-3); }
  ul.plain { padding-left: 18px; font-size: 13.5px; }
  ul.plain li { margin-bottom: 5px; }
  .footer-note { text-align: center; font-size: 11.5px; color: var(--text-4); margin-top: 26px; line-height: 1.6; }
  @media (min-width: 760px) { .poslist { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .poslist .card { margin-bottom: 0; } }
</style>
</head>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let DATA = null;

  // ---- crypto: must mirror scripts/publish_dashboard.py exactly ----
  async function decrypt(blob, accessCode) {
    const enc = new TextEncoder();
    const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const material = await crypto.subtle.importKey(
      "raw", enc.encode(accessCode), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(blob.salt), iterations: blob.iters, hash: "SHA-256" },
      material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, key, b64(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  function esc(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function bandColors(band) {
    return band === "green" ? ["var(--green)", "var(--green-bg)", "var(--green-border)"]
         : band === "amber" ? ["var(--amber)", "var(--amber-bg)", "var(--amber-border)"]
         : ["var(--red)", "var(--red-bg)", "var(--red-border)"];
  }
  function ring(fit, band, lg) {
    const [c, bg, bd] = bandColors(band);
    return `<span class="ring ${lg ? "lg" : ""}" style="color:${c};background:${bg};border:3px solid ${bd}">${fit}</span>`;
  }
  function stageTag(label, key, big) {
    if (!label) return "";
    return `<span class="stagetag st-${esc(key || "")} ${big ? "big" : ""}">${esc(label)}</span>`;
  }
  function gateDots(c) { return ""; }
  function gateStrip(c) {
    if (!c.process) return "";
    let html = `<div class="rail">` + c.process.map(st => `
      <div class="rrow r-${st.state}">
        <span class="rdot"></span>
        <span class="rlabel">${esc(st.label)}</span>
        ${st.at ? `<span class="rdate">${esc(st.at)}</span>` : ""}
      </div>`).join("") + `</div>`;
    if (c.stage === "Passed") html += `<div class="rail-outcome o-red">Passed on this candidate</div>`;
    else if (c.stage === "Hired") html += `<div class="rail-outcome o-green">Hired</div>`;
    else if (c.stage === "Parked") html += `<div class="rail-outcome">On hold</div>`;
    return html;
  }
  function freshness(ts) {
    const d = new Date(ts.slice(0,4) + "-" + ts.slice(4,6) + "-" + ts.slice(6,8) + "T" +
                       ts.slice(9,11) + ":" + ts.slice(11,13) + ":" + ts.slice(13,15) + "Z");
    const mins = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
    return mins < 60 ? `Updated ${mins} min ago`
         : mins < 2880 ? `Updated ${Math.round(mins / 60)} h ago`
         : `Updated ${d.toLocaleDateString()}`;
  }

  // ---- views ----
  function buildIndex() {
    DATA._byId = {};
    DATA.positions.forEach((p, pi) => p.candidates.forEach((c, ci) => { DATA._byId[c.id] = [pi, ci]; }));
  }
  function nirRow(c) {
    const clickable = !!c.id;
    return `<div class="crow ${clickable ? "" : "crow-static"}" ${clickable ? `data-id="${esc(c.id)}"` : ""}>
      <div><div class="cname">${esc(c.name)}</div><div class="cstage">${esc(c.role)}</div></div>
      <span class="ctag">${stageTag(c.process_label, c.process_key)}</span>
      <span class="chev-slot">${clickable ? `<span class="chev">&rsaquo;</span>` : ""}</span></div>`;
  }
  function shmulikSection(list) {
    const byRole = {};
    list.forEach(c => { (byRole[c.role] = byRole[c.role] || []).push(c); });
    return Object.keys(byRole).sort().map(role => `
      <div class="role-sub">${esc(role)} <span class="role-count">${byRole[role].length}</span></div>
      ${byRole[role].map(nirRow).join("")}`).join("");
  }

  function renderHome() {
    buildIndex();
    const n = DATA.nir;
    const going = n.going_to_see, hired = n.hired, rejected = n.rejected;
    const withdrawn = n.withdrawn || [];
    const forYou = going.filter(c => c.action_needed);
    const inMotion = going.filter(c => !c.action_needed);
    let html = `<div class="tiles">
      <div class="tile lead"><div class="tn">${forYou.length}</div><div class="tl">Waiting for you</div><div class="ts">your next interviews</div></div>
      <div class="tile"><div class="tn">${n.seen_count}</div><div class="tl">Seen</div><div class="ts">${hired.length} hired &middot; ${rejected.length} passed</div></div>
      <div class="tile rej"><div class="tn">${rejected.length}</div><div class="tl">Rejected</div><div class="ts">${withdrawn.length ? withdrawn.length + " also withdrew" : "no longer active"}</div></div>
    </div>`;

    if (forYou.length) {
      html += `<div class="sec-title">Waiting for you</div><div class="card action-card" style="padding:6px 20px">${forYou.map(nirRow).join("")}</div>`;
    }
    if (inMotion.length) {
      html += `<div class="sec-title">In motion &middot; with the hiring managers</div><div class="card dim-card" style="padding:6px 20px">${inMotion.map(nirRow).join("")}</div>`;
    }
    if ((n.shmulik || []).length) {
      html += `<div class="sec-title">Shmulik's pipeline &middot; ${n.shmulik.length} candidates in work across all roles</div><div class="card dim-card" style="padding:6px 20px">${shmulikSection(n.shmulik)}</div>`;
    }
    if (withdrawn.length) {
      html += `<div class="sec-title">Withdrew &middot; candidate pulled out</div><div class="card dim-card" style="padding:6px 20px">${withdrawn.map(nirRow).join("")}</div>`;
    }
    if (!going.length && !hired.length && !rejected.length) {
      html += `<div class="banner quiet">No candidates in your pipeline yet. They appear here the moment one is cleared to you.</div>`;
    }


    // keep the full per-position view below, for exploring
    html += `<hr class="divider"><div class="explore-h">Explore the full pipeline</div>
      <div class="muted-line" style="margin-top:0">Every role, sourcing to interview.</div>
      <div class="poslist">`;
    DATA.positions.forEach((p, pi) => {
      const ready = p.candidates.filter(c => c.stage === "Ready for you").length;
      html += `<div class="card pos">
        <div class="pos-head"><h2>${esc(p.role)}</h2>
          ${ready ? `<span class="ready-pill">${ready} ready for you</span>` : ""}</div>
        <div class="funnel">` +
        [["Sourced", p.sourced], ["Contacted", p.contacted],
         ["In screening", p.in_screening], ["Interviewed", p.candidates.length]]
          .map(([l, n], i, arr) => {
            const max = arr[0][1] || 1;
            return `<div class="frow"><span class="flabel">${l}</span>
              <span class="ftrack"><span class="ffill" style="width:${Math.min(100, Math.round(100 * n / max))}%"></span></span>
              <span class="fnum num">${n}</span></div>`;
          }).join("") + `</div>`;
      if (p.candidates.length) {
        html += p.candidates.map((c, ci) => `
          <div class="crow ${c.stage === "Passed" ? "dim-row" : ""}" data-pos="${pi}" data-c="${ci}">
            <div><div class="cname">${esc(c.name)}</div></div>
            <span class="ctag">${["Passed","Hired","Parked"].includes(c.stage) ? stageTag(c.stage, c.stage) : stageTag(c.process_label, c.process_key)}</span>
            <span class="chev-slot"><span class="chev">&rsaquo;</span></span>
          </div>`).join("");
      } else {
        html += `<div class="crow" style="cursor:default;color:var(--text-4);font-size:13px">
          No one interviewed for this role yet. Sourcing is underway.</div>`;
      }
      html += `</div>`;
    });
    html += `</div>
      <div class="footer-note">Pipeline maintained by Shmulik &middot; updates automatically.<br>The call is yours.</div>`;
    $("view").innerHTML = html;
    document.querySelectorAll(".crow[data-pos]").forEach(row => {
      row.addEventListener("click", () =>
        renderDetail(Number(row.dataset.pos), Number(row.dataset.c)));
    });
    document.querySelectorAll(".crow[data-id]").forEach(row => {
      row.addEventListener("click", () => {
        const idx = DATA._byId[row.dataset.id];
        if (idx) renderDetail(idx[0], idx[1]);
      });
    });
    window.scrollTo(0, 0);
  }

  function renderDetail(pi, ci) {
    const p = DATA.positions[pi], c = p.candidates[ci];
    let html = `<button class="back" id="back">&lsaquo; All candidates</button>
      <div class="card">
        <div class="dhead">
          <div><h1>${esc(c.name)}</h1><div class="sub">${esc(c.role)}
            ${c.linkedin ? ` &middot; <a class="lilink" href="${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn &#8599;</a>` : ""}</div>
          <div>${["Passed","Hired","Parked"].includes(c.stage) ? stageTag(c.stage, c.stage, true) : stageTag(c.process_label, c.process_key, true)}</div>
          </div></div>
        ${gateStrip(c)}
      </div>`;

    html += `<div class="footer-note">Pipeline status prepared by Shmulik. Full candidate details in your interview invite or on request.</div>`;
    $("view").innerHTML = html;
    $("back").addEventListener("click", renderHome);
    window.scrollTo(0, 0);
  }

  // ---- gate flow ----
  async function tryOpen() {
    const btn = $("open"), err = $("gate-err");
    err.style.display = "none";
    btn.disabled = true; btn.textContent = "Opening…";
    try {
      const blob = await (await fetch("data.enc.json", { cache: "no-store" })).json();
      DATA = await decrypt(blob, $("code").value.trim());
      $("fresh-label").textContent = freshness(DATA.generated_at);
      $("gate").style.display = "none";
      $("app").style.display = "";
      renderHome();
    } catch (e) {
      err.textContent = "That code did not work. Check it and try again.";
      err.style.display = "block";
    }
    btn.disabled = false; btn.textContent = "Open";
  }
  $("open").addEventListener("click", tryOpen);
  $("code").addEventListener("keydown", (e) => { if (e.key === "Enter") tryOpen(); });
  $("code").focus();
})();
</script>
</body>
</html>
